name: Build Windows x86 Release
description: Build and package the HeapPatch plugin.

outputs:
  archive-path:
    description: Absolute path to the Windows x86 7z archive.
    value: ${{ steps.package.outputs.archive-path }}

runs:
  using: composite
  steps:
    - name: Clone MetaHook SDK headers
      shell: pwsh
      run: |
        $metahookPath = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'MetaHook'
        & git clone --depth 1 --branch main https://github.com/MetaHookSv/MetaHook $metahookPath
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # capstone_fork feeds HeapPatch's default Capstone header resolution.
        & git -C $metahookPath submodule update --init --depth 1 -- thirdparty/capstone_fork
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & git -C $metahookPath rev-parse HEAD
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # The plugin consumes include/ only: it compiles interface.cpp and links no SDK library.
        "METAHOOK_SOURCE_PATH=$metahookPath" >> $env:GITHUB_ENV

    - name: Build and install
      shell: cmd
      run: call scripts\build-HeapPatch-x86-Release.bat "-DMETAHOOK_SOURCE_PATH=%METAHOOK_SOURCE_PATH%"

    - name: Validate installed gamedata
      shell: cmd
      run: python scripts\validate-gamedata.py install\x86\Release\svencoop\metahook\gamedata\heappatch --manifest scripts\manifests\heappatch.json

    - name: Package plugin
      id: package
      shell: pwsh
      working-directory: install/x86/Release
      run: |
        $archiveDirectory = Join-Path $env:GITHUB_WORKSPACE 'build/artifacts'
        New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
        $archivePath = Join-Path $archiveDirectory 'HeapPatch-windows-x86.7z'
        if (Test-Path -LiteralPath $archivePath -PathType Leaf) {
          Remove-Item -LiteralPath $archivePath
        }
        & 7z a -t7z $archivePath 'svencoop'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & 7z t $archivePath
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "archive-path=$archivePath" >> $env:GITHUB_OUTPUT
